<title>财库 · 片场</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: one narrow column of five numbered takes, each = prompt + copy + upload slot. Order is real: clips are shot 1→5. */
:root{
  --bg:#f3f1ec; --card:#fbfaf7; --ink:#24211c; --muted:#6f685d; --line:#ddd6c8;
  --seal:#a8322a; --gold:#9a7428; --ok:#3f7a4e;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191714; --card:#221f1b; --ink:#ece6da; --muted:#a39a8a; --line:#38332c;
  --seal:#d0574c; --gold:#d2ab5c; --ok:#79b98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191714; --card:#221f1b; --ink:#ece6da; --muted:#a39a8a; --line:#38332c;
  --seal:#d0574c; --gold:#d2ab5c; --ok:#79b98a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header{display:flex;gap:14px;align-items:flex-start}
.seal{flex:none;width:46px;height:46px;border:2px solid var(--seal);color:var(--seal);border-radius:4px;
  font-family:var(--serif);font-weight:900;font-size:17px;line-height:19px;display:grid;place-items:center;text-align:center;letter-spacing:1px}
h1{font-family:var(--serif);font-weight:900;font-size:26px;margin:0;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.how{color:var(--muted);font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px;margin:0}
.progress{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.progress b{color:var(--ink)}
.take{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.take.done{border-color:var(--ok)}
.row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.no{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.scene{font-weight:600}
.who{font-size:13px;color:var(--muted)}
.lines{font-family:var(--serif);font-size:16px;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;line-height:1.5;
  background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0 0;max-height:260px;overflow:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.up{font:inherit;font-size:15px;font-weight:600;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--ink)}
button{background:var(--ink);color:var(--bg)}
.up{background:transparent;color:var(--ink);display:inline-flex;align-items:center}
.up input{display:none}
button:focus-visible,.up:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--seal)}
video{width:100%;max-width:100%;border-radius:6px;background:#000}
.title{text-align:center;font-family:var(--serif);font-weight:900;color:var(--gold);font-size:18px;letter-spacing:2px;margin:0}
</style>

<div class="wrap">
  <header>
    <div class="seal">财<br>库</div>
    <div>
      <h1>钱为什么存不住</h1>
      <p class="sub">五行短剧 · 贪合忘冲 · 5 段</p>
    </div>
  </header>
  <p class="how">按顺序来：点「复制提示词」→ 粘进 Muse 生成 → 回到这里点「上传视频」。5 段都传完，告诉 Claude 一声，后面的拼接、1.4 倍速、字幕都交给它。</p>
  <div class="progress" id="progress"></div>
  <div id="takes" style="display:flex;flex-direction:column;gap:14px"></div>
  <p class="title">财库逢冲钱难守，冲神遇合便忘冲。</p>
</div>

<script>
const CLIPS = [{"n": 1, "who": "火妹", "lines": "这个月工资，一分不动。 / ……动了。", "scene": "放金币 → 小羊撞门 → 金币飞走", "prompt": "Pixar-style 3D animation, a sunny green grassy hillside with an old earthen cellar door built into the slope (a heavy round wooden door with brass studs), warm soft afternoon light, 16:9. NO on-screen text, NO subtitles, NO signs. Same hillside and cellar door for the whole clip.\nCHARACTERS IN THIS CLIP: EXACTLY TWO. Each keeps its own body, face and colors from start to end. Never merge, swap or recolor them. No physical contact between them.\n- FIRE GIRL: a young adult fire spirit woman, cartoon proportions, her hair is a living orange flame, wearing a simple cream-colored dress, huge expressive eyes, very exaggerated rubbery facial expressions. Colors: orange, red-orange and cream only.\n- GOAT: a chubby cartoon young goat spirit on four legs, fluffy beige wool, small curled horns, big dopey innocent eyes, very exaggerated reactions. Colors: beige, cream and light brown only.\nSPEAKER: ONLY FIRE GIRL speaks. GOAT never speaks, mouth closed.\n\n0-3s: Medium shot, FIRE GIRL alone in front of the cellar door, side view. She puts a small sack of gold coins inside, shuts the door and pats it proudly, chin up, looking at the door (not at the camera): \"这个月工资，一分不动。\"\n3-6s: Wide shot, nobody talks: far behind her, GOAT scrapes the ground with a hoof, then charges past her at a distance and headbutts ONLY the cellar door. The door bursts open and gold coins fly out into the air like a fountain and roll away down the hill. GOAT never touches FIRE GIRL.\n6-10s: Close-up of FIRE GIRL, side view, watching the coins fly away, face completely blank and deadpan, her flame hair shrinks a little: \"……动了。\"\n"}, {"n": 2, "who": "火妹 → 小羊", "lines": "来啊！这回你撞啊！ / 咩？好嘞！", "scene": "三把锁 → 助跑 → 整扇门飞走", "prompt": "Pixar-style 3D animation, a sunny green grassy hillside with an old earthen cellar door built into the slope (a heavy round wooden door with brass studs), warm soft afternoon light, 16:9. NO on-screen text, NO subtitles, NO signs. Same hillside and cellar door for the whole clip.\nThe cellar door now has three huge padlocks and heavy iron chains on it.\nCHARACTERS IN THIS CLIP: EXACTLY TWO. Each keeps its own body, face and colors from start to end. Never merge, swap or recolor them. No physical contact between them.\n- FIRE GIRL: a young adult fire spirit woman, cartoon proportions, her hair is a living orange flame, wearing a simple cream-colored dress, huge expressive eyes, very exaggerated rubbery facial expressions. Colors: orange, red-orange and cream only.\n- GOAT: a chubby cartoon young goat spirit on four legs, fluffy beige wool, small curled horns, big dopey innocent eyes, very exaggerated reactions. Colors: beige, cream and light brown only.\nSPEAKERS IN ORDER: first ONLY FIRE GIRL, then ONLY GOAT. They speak TO each other, never to the camera. Whoever is not speaking keeps their mouth closed and is seen only from behind.\n\n0-4s: OVER-THE-SHOULDER SHOT from behind GOAT, its woolly head blurred in the foreground, face NOT visible. FIRE GIRL in focus, standing beside the locked door, hands on hips, flame hair blazing high, looking at GOAT, super cocky: \"来啊！这回你撞啊！\"\n4-6s: OVER-THE-SHOULDER SHOT from behind FIRE GIRL, her flame hair blurred in the foreground, face NOT visible. GOAT in focus, looking at her, blinking innocently, then cheerfully: \"咩？好嘞！\"\n6-10s: Wide shot, nobody talks: GOAT backs up very far, takes a long run and headbutts ONLY the door. The whole door flies off with all the locks and chains and spins into the sky. FIRE GIRL stands at a safe distance, frozen, jaw dropped to the ground in an exaggerated cartoon way.\n"}, {"n": 3, "who": "火妹 → 土地爷", "lines": "锁也没用，我咋办啊？ / 别锁了，给它找个伴。", "scene": "火妹蔫了 → 土地爷支招", "prompt": "Pixar-style 3D animation, a sunny green grassy hillside with an old earthen cellar door built into the slope (a heavy round wooden door with brass studs), warm soft afternoon light, 16:9. NO on-screen text, NO subtitles, NO signs. Same hillside and cellar door for the whole clip.\nThe cellar door is gone; the cellar entrance is an empty dark hole.\nCHARACTERS IN THIS CLIP: EXACTLY TWO. Each keeps its own body, face and colors from start to end. Never merge, swap or recolor them. No physical contact between them.\n- FIRE GIRL: a young adult fire spirit woman, cartoon proportions, her hair is a living orange flame, wearing a simple cream-colored dress, huge expressive eyes, very exaggerated rubbery facial expressions. Colors: orange, red-orange and cream only.\n- OLD EARTH GOD: a short old man spirit with a long white beard, plain brown robe, a wooden walking cane, sleepy half-closed eyes, slow and calm. Colors: earth brown, white and grey only.\nSPEAKERS IN ORDER: first ONLY FIRE GIRL, then ONLY OLD EARTH GOD. They speak TO each other, never to the camera. Whoever is not speaking keeps their mouth closed and is seen only from behind.\n\n0-2s: Wide side shot, nobody talks: FIRE GIRL squats sadly at the empty cellar entrance, her flame hair drooping very low like a wilted candle. OLD EARTH GOD slowly walks up with his cane and stops a few steps away.\n2-6s: OVER-THE-SHOULDER SHOT from behind OLD EARTH GOD, his white hair blurred in the foreground, face NOT visible. FIRE GIRL in focus, looking up at him, eyes huge and watery in an exaggerated cartoon pout: \"锁也没用，我咋办啊？\"\n6-10s: OVER-THE-SHOULDER SHOT from behind FIRE GIRL, her flame hair blurred in the foreground, face NOT visible. OLD EARTH GOD in focus, looking down at her, calm, stroking his beard, eyes half-closed: \"别锁了，给它找个伴。\"\n"}, {"n": 4, "who": "马姐 → 小羊", "lines": "一起走走？ / 走、走走走！", "scene": "小羊急刹，眼冒爱心", "prompt": "Pixar-style 3D animation, a sunny green grassy hillside with an old earthen cellar door built into the slope (a heavy round wooden door with brass studs), warm soft afternoon light, 16:9. NO on-screen text, NO subtitles, NO signs. Same hillside and cellar door for the whole clip.\nCHARACTERS IN THIS CLIP: EXACTLY TWO. Each keeps its own body, face and colors from start to end. Never merge, swap or recolor them. No physical contact between them.\n- GOAT: a chubby cartoon young goat spirit on four legs, fluffy beige wool, small curled horns, big dopey innocent eyes, very exaggerated reactions. Colors: beige, cream and light brown only.\n- HORSE LADY: an elegant slender white horse spirit on four legs, long flowing silver mane, long eyelashes, graceful slow walk. Colors: white, silver and pale gold only.\nSPEAKERS IN ORDER: first ONLY HORSE LADY, then ONLY GOAT. They speak TO each other, never to the camera. Whoever is not speaking keeps their mouth closed and is seen only from behind.\n\n0-3s: Wide side shot, nobody talks: GOAT is running fast toward the cellar door again. HORSE LADY gracefully walks into the path from the side, her silver mane flowing in slow motion. GOAT slams on the brakes, skidding to a stop with dust, a few steps away from her. Its eyes turn into two big pink cartoon hearts and it freezes stiff.\n3-6s: OVER-THE-SHOULDER SHOT from behind GOAT, its woolly head blurred in the foreground, face NOT visible. HORSE LADY in focus, looking at GOAT, tilting her head with a gentle smile: \"一起走走？\"\n6-10s: OVER-THE-SHOULDER SHOT from behind HORSE LADY, her silver mane blurred in the foreground, face NOT visible. GOAT in focus, looking at her, heart eyes, nodding way too fast, stammering, tail wagging wildly: \"走、走走走！\"\n"}, {"n": 5, "who": "火妹", "lines": "这个月，真的存下了。", "scene": "关门、透金光 → 结尾金字", "prompt": "Pixar-style 3D animation, a sunny green grassy hillside with an old earthen cellar door built into the slope (a heavy round wooden door with brass studs), warm soft afternoon light, 16:9. No subtitles. NO other text except the final title. Same hillside and cellar door for the whole clip.\nA new round wooden door is on the cellar.\nCHARACTERS IN THIS CLIP: EXACTLY ONE. FIRE GIRL is ALONE. Nobody else appears.\n- FIRE GIRL: a young adult fire spirit woman, cartoon proportions, her hair is a living orange flame, wearing a simple cream-colored dress, huge expressive eyes, very exaggerated rubbery facial expressions. Colors: orange, red-orange and cream only.\nSPEAKER: ONLY FIRE GIRL speaks.\n\n0-2s: Wide shot, nobody talks: FIRE GIRL ALONE gently closes the cellar door. It shuts with a soft click, and warm golden light glows through the gap around the door.\n2-6s: Medium close-up of FIRE GIRL, side view, looking at the door (not at the camera), trying hard not to smile but the corners of her mouth keep rising, her flame hair slowly grows tall and bright: \"这个月，真的存下了。\"\n6-10s: Camera slowly pulls back, background softly blurs, a few fine gold dust particles drift. Refined, restrained Chinese brush calligraphy in soft muted antique gold, flat matte like gold ink on paper, only a faint warm glow, NOT shiny, NOT metallic, NOT 3D, NOT bevelled, NOT gradient, fades in slowly at the center of the screen, in exactly two lines:\n财库逢冲钱难守，\n冲神遇合便忘冲。\nRender these Chinese characters exactly as written, clear and correct, no other text on screen. Hold until the end.\n"}];
const state = {};           // n -> {asset, name}
let assets = null, db = null;

function render(){
  const box = document.getElementById("takes"); box.textContent = "";
  let done = 0;
  for (const c of CLIPS){
    const s = state[c.n]; if (s) done++;
    const el = document.createElement("section"); el.className = "take" + (s ? " done" : "");
    el.innerHTML = `
      <div class="row"><span class="no">${String(c.n).padStart(2,"0")}</span><span class="scene"></span><span class="who"></span></div>
      <p class="lines"></p>
      <details><summary>看提示词全文</summary><pre></pre></details>
      <div class="actions">
        <button type="button" id="copy${c.n}">复制提示词</button>
        <label class="up" id="uplabel${c.n}">${s ? "重新上传" : "上传视频"}<input type="file" id="file${c.n}" accept="video/mp4,video/webm,video/quicktime,video/*"></label>
        <span class="status" id="st${c.n}"></span>
      </div>`;
    el.querySelector(".scene").textContent = c.scene;
    el.querySelector(".who").textContent = c.who;
    el.querySelector(".lines").textContent = c.lines;
    el.querySelector("pre").textContent = c.prompt;
    const st = el.querySelector(".status");
    if (s){ st.textContent = "已上传 ✓ " + (s.name || ""); st.className = "status ok";
      const v = document.createElement("video"); v.controls = true; v.playsInline = true; v.preload = "metadata"; v.src = "/_blob/" + s.asset; el.appendChild(v); }
    if (!assets) el.querySelector(".up").hidden = true;
    el.querySelector("button").onclick = () => copy(c, st);
    el.querySelector("input").onchange = e => upload(c, e.target.files[0], st);
    box.appendChild(el);
  }
  document.getElementById("progress").innerHTML = `已上传 <b>${done}</b> / 5`;
}

async function copy(c, st){
  try { await navigator.clipboard.writeText(c.prompt); st.textContent = "已复制，去 Muse 粘贴"; st.className = "status ok"; }
  catch { const pre = document.querySelectorAll("pre")[c.n-1]; pre.parentElement.open = true;
    const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    st.textContent = "已选中全文，长按拷贝"; st.className = "status"; }
}

async function upload(c, file, st){
  if (!file) return;
  if (file.size > 20*1024*1024){ st.textContent = "超过 20MB，传不上去。告诉 Claude，换个办法"; st.className = "status err"; return; }
  st.textContent = "上传中…"; st.className = "status";
  let type = file.type; if (!["video/mp4","video/webm"].includes(type)) type = "video/mp4";
  try {
    const r = await assets.upload(file, {type});
    state[c.n] = {asset: r.id, name: file.name};
    if (db) await db.doc("clips/c" + c.n).set({n: c.n, asset: r.id, name: file.name, at: new Date().toISOString()});
    render();
  } catch (e) {
    st.className = "status err";
    st.textContent = e && e.code === "unsupported_type" ? "格式不支持，请导出成 MP4 再传" :
                     e && e.code === "too_large" ? "文件太大（上限 20MB）" : "上传失败，再试一次";
  }
}

render();
(async () => {
  try { assets = await claude.use("assets"); } catch {}
  try { db = await claude.use("db"); } catch {}
  if (db){
    db.collection("clips").onSnapshot(snap => {
      for (const d of snap.docs){ const v = d.data(); if (v && v.n && v.asset) state[v.n] = {asset: v.asset, name: v.name}; }
      render();
    }, () => render());
  }
  render();
})();
</script>
